# Runs the whole pipeline on GitHub's computers and saves the new results to this repo.
# The Streamlit dashboard reads the repo, so it updates by itself a few minutes later.
#
# Runs automatically on the 22nd of every month (after Zillow's monthly update).
# To run it now: Actions tab -> "Monthly data update" -> "Run workflow".
name: Monthly data update

on:
  schedule:
    - cron: "17 13 22 * *"   # 13:17 UTC on the 22nd (about 8 or 9am New York time)
  workflow_dispatch:          # adds the "Run workflow" button

permissions:
  contents: write             # lets the run save results back to the repo

concurrency:
  group: monthly-update       # never two runs at once
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Get the code and saved data
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: "Step 1: download new data"
        # if downloading runs long, stop it and still build, test and save what came in
        timeout-minutes: 270
        continue-on-error: true
        run: python step1_collect.py
        env:
          MEDIACLOUD_API_KEY: ${{ secrets.MEDIACLOUD_API_KEY }}   # free key, stored as a GitHub secret

      - name: "Steps 2-4: build the table, test the model, make the score"
        run: |
          python step2_build.py
          python step3_model.py
          python step4_index.py

      - name: "Steps 5-11: extra tests, charts, stability checks, search and news (allowed to fail)"
        continue-on-error: true
        run: |
          python step5_activity.py || echo "step 5 failed"
          python step6_findings.py || echo "step 6 failed"
          python step7_signal_tests.py || echo "step 7 failed"
          python step8_robustness.py || echo "step 8 failed"
          python step9_stability.py || echo "step 9 failed"
          python step10_search.py || echo "step 10 failed"
          python step11_news.py || echo "step 11 failed"

      - name: Save new data and results to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data results
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Monthly data update $(date -u +%Y-%m-%d)"
            git pull --rebase origin main   # in case someone pushed while this was running
            git push
          fi

      - name: Show the download log
        if: always()
        run: tail -n 80 data/collect_log.txt || true
